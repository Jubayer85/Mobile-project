<div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-auto">

  <!-- Header -->
  <div class="px-6 py-4 border-b flex items-center justify-between">
    <h3 class="text-lg font-semibold text-slate-800">
      Add Sub Category
    </h3>
    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
      ✕
    </button>
  </div>

  <!-- Body -->
  <div class="p-6">
    <form
      hx-post="{% url 'add_subcategory' %}"
      hx-target="#subcategory-select"
      hx-swap="beforeend"
      class="space-y-4"
    >
      {% csrf_token %}

      <!-- Parent Category -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Parent Category
        </label>
        <select
          name="category"
          required
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500"
        >
          <option value="">Select category</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Subcategory Name -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Sub Category Name
        </label>
        <input
          type="text"
          name="name"
          required
          placeholder="e.g. Smartphones"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4 border-t">
        <button
          type="button"
          onclick="closeModal()"
          class="px-4 py-2 rounded-lg border text-slate-600 hover:bg-slate-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700"
        >
          Save
        </button>
      </div>

    </form>
  </div>
</div>
