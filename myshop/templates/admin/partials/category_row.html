<div id="category-{{ category.id }}" class="group">
  <div class="bg-white rounded-2xl border border-gray-200 p-5 hover:shadow-2xl transition-all duration-300 ease-in-out transform hover:-translate-y-1">
    
    <!-- Header -->
    <div class="flex items-start justify-between mb-4">
      
      <!-- Category Info -->
      <div class="flex-1 flex items-center">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center mr-4 shadow-inner group-hover:shadow-lg transition-all duration-300">
          <i class="fas fa-folder text-indigo-600 text-xl"></i>
        </div>
        <div class="flex-1">
          <h4 class="font-semibold text-gray-900 text-base md:text-lg truncate">{{ category.name }}</h4>
          <div class="mt-1 text-xs text-gray-500 truncate">{{ category.slug }}</div>
          {% if category.description %}
          <p class="mt-2 text-sm text-gray-600 line-clamp-3">{{ category.description }}</p>
          {% endif %}
        </div>
      </div>

      <!-- Status Badge -->
      <button
        type="button"
        hx-post="{% url 'admin_dashboard:category_toggle' category.id %}"
        hx-target="#category-{{ category.id }}"
        hx-swap="outerHTML"
        class="inline-flex items-center px-4 py-1 rounded-full text-sm font-semibold ml-4 shadow-sm
               {% if category.is_active %}bg-green-50 text-green-800 hover:bg-green-100{% else %}bg-red-50 text-red-800 hover:bg-red-100{% endif %} transition-all duration-200"
      >
        <span class="w-2.5 h-2.5 rounded-full mr-2
                     {% if category.is_active %}bg-green-500{% else %}bg-red-500{% endif %} animate-pulse"></span>
        {{ category.is_active|yesno:"Active,Inactive" }}
      </button>
    </div>

    <!-- Stats & Actions -->
    <div class="flex items-center justify-between pt-4 border-t border-gray-100">
      
      <!-- Stats -->
      <div class="flex items-center space-x-6 text-gray-500 text-xs md:text-sm">
        <div class="flex items-center space-x-1">
          <i class="fas fa-box text-gray-400"></i>
          <span>{{ category.product_count|default:"0" }} products</span>
        </div>
        <div class="flex items-center space-x-1">
          <i class="fas fa-tags text-gray-400"></i>
          <span>{{ category.subcategory_count|default:"0" }} subcategories</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center space-x-2">
        <!-- Edit -->
        <button
          type="button"
          hx-get="{% url 'admin_dashboard:category_edit' category.id %}"
          hx-target="#category-{{ category.id }}"
          hx-swap="outerHTML"
          class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-100 shadow-md flex items-center justify-center transition transform hover:scale-105"
          title="Edit">
          <i class="fas fa-edit text-sm"></i>
        </button>

        <!-- Delete -->
        <button
          type="button"
          hx-delete="{% url 'admin_dashboard:category_delete' category.id %}"
          hx-target="#category-{{ category.id }}"
          hx-swap="outerHTML"
          hx-confirm="Delete this category?"
          class="w-9 h-9 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 shadow-md flex items-center justify-center transition transform hover:scale-105"
          title="Delete">
          <i class="fas fa-trash-alt text-sm"></i>
        </button>
      </div>

    </div>
  </div>
</div>
