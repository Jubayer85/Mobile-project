<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
     x-data="{ show: true }"
     x-init="setTimeout(() => { show = false; $dispatch('close-modal'); }, 2000)"
     x-show="show"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 scale-100"
     x-transition:leave-end="opacity-0 scale-95">
    
    <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm text-center animate-scale-in">
        <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-check-circle text-emerald-500 text-2xl"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-800 mb-2">Success!</h3>
        <p class="text-slate-600 mb-1">{{ message }}</p>
        <div class="mt-3 p-3 bg-slate-50 rounded-lg">
            <div class="flex items-center justify-center">
                <i class="{{ category.icon|default:'fas fa-folder' }} mr-2 text-indigo-500"></i>
                <span class="font-medium">{{ category.name }}</span>
            </div>
        </div>
        <div class="mt-5 pt-4 border-t border-slate-200">
            <p class="text-xs text-slate-500">The new category has been added to the dropdown</p>
        </div>
    </div>
</div>

<script>
// Dispatch event to update parent form
window.dispatchEvent(new CustomEvent('category-created', {
    detail: {
        id: {{ category.id }},
        name: "{{ category.name }}",
        icon: "{{ category.icon|default:'fas fa-folder' }}",
        slug: "{{ category.slug }}"
    }
}));
</script>
