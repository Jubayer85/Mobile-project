<div class="fixed inset-0 bg-black/50 flex items-center justify-center">
  <div class="bg-white p-6 rounded w-96">
    <h3 class="font-bold mb-3">Add Category</h3>

    <form
      hx-post="{% url 'category_add' %}"
      hx-target="#categories-table"
      hx-swap="innerHTML">

      {% csrf_token %}

      <input name="name" placeholder="Name" class="w-full border p-2 mb-2">
      <input name="slug" placeholder="Slug" class="w-full border p-2 mb-2">

      <select name="parent" class="w-full border p-2 mb-4">
        <option value="">Main Category</option>
        {% for c in categories %}
          <option value="{{c.id}}">{{c.name}}</option>
        {% endfor %}
      </select>

      <div class="flex justify-end gap-2">
        <button type="button" onclick="this.closest('.fixed').remove()">Cancel</button>
        <button class="bg-indigo-600 text-white px-4 py-1 rounded">Save</button>
      </div>
    </form>
  </div>
</div>
