<div class="relative bg-white rounded-xl shadow-xl max-w-md w-full p-6 mx-auto my-20">
    <button onclick="closeModal()" 
            class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
    
    <h3 class="text-lg font-semibold text-slate-800 mb-4">
        Add New Brand
    </h3>
    
    <form hx-post="{% url 'add_brand' %}"
          hx-target="#id_brand"
          hx-swap="beforeend"
          hx-on::after-request="if(event.detail.successful) { this.reset(); closeModal(); }">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">
                    Brand Name *
                </label>
                <input type="text" 
                       name="name" 
                       required
                       class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-800 shadow-sm 
                              focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition"
                       placeholder="Enter brand name"
                       autofocus>
                <p class="text-xs text-slate-400 mt-1">
                    Slug will be auto-generated from name
                </p>
            </div>
        </div>
        
        <div class="mt-6 flex justify-end gap-3">
            <button type="button"
                    onclick="closeModal()"
                    class="px-4 py-2 text-sm text-slate-600 hover:text-slate-800 rounded-lg border border-slate-300">
                Cancel
            </button>
            <button type="submit"
                    class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
                Add Brand
            </button>
        </div>
    </form>
</div>
